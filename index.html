<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול בר אלכוהול</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1, h2 { color: #ffb74d; text-align: center; }
        .section { background: #2c2c2c; padding: 15px; margin-bottom: 20px; border-radius: 6px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; box-sizing: border-box; }
        button { background: #ff9800; color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
        button:hover { background: #e68900; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #444; padding: 8px; text-align: right; }
        th { background: #333; }
        .flex { display: flex; gap: 10px; }
        .flex > * { flex: 1; }
        .status-open { color: #4caf50; font-weight: bold; }
        .status-closed { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍸 מסך ניהול - בר</h1>
    
    <!-- סטטוס יום עבודה -->
    <div class="section">
        <h2>ניהול יומי</h2>
        <p>סטטוס היום: <span id="dayStatus" class="status-closed">סגור</span></p>
        <div class="flex">
            <button onclick="toggleDay(true)">פתיחת יום עבודה</button>
            <button onclick="toggleDay(false)" style="background: #f44336; color: #fff;">סגירת יום</button>
        </div>
    </div>

    <!-- מסך הבר (ניהול ותצוגה) -->
    <div class="section">
        <h2>הזמנות פעילות להיום</h2>
        <table>
            <thead>
                <tr>
                    <th>שם הלקוח</th>
                    <th>מס' חבר</th>
                    <th>משקה</th>
                    <th>כמות</th>
                    <th>סה"כ</th>
                    <th>פעולה</th>
                </tr>
            </thead>
            <tbody id="activeOrdersTable">
                <tr><td colspan="6" style="text-align:center;">טוען נתונים...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- ניהול רשימת משקאות ומחירים -->
    <div class="section">
        <h2>ניהול תפריט ומחירים</h2>
        <div class="flex">
            <input type="text" id="newDrinkName" placeholder="שם המשקה">
            <input type="number" id="newDrinkPrice" placeholder="מחיר ב-₪" min="0">
            <button onclick="addDrink()">הוסף לתפריט</button>
        </div>
        <ul id="drinksList" style="list-style: none; padding: 0; margin-top: 10px;"></ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDiqurgDyB2IwQUheisvCnS06sWiNv88Pw",
        authDomain: "ussishkinpub.firebaseapp.com",
        databaseURL: "https://ussishkinpub-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "ussishkinpub",
        storageBucket: "ussishkinpub.firebasestorage.app",
        messagingSenderId: "571602412205",
        appId: "1:571602412205:web:54f97c832c1e8996375c24",
        measurementId: "G-7VPNEK0ENH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // סטטוס יום
    onValue(ref(db, 'status/isDayOpen'), (snapshot) => {
        const isOpen = snapshot.val();
        const statusEl = document.getElementById('dayStatus');
        if (isOpen) {
            statusEl.textContent = 'פתוח לקבלת הזמנות';
            statusEl.className = 'status-open';
        } else {
            statusEl.textContent = 'סגור';
            statusEl.className = 'status-closed';
        }
    });

    window.toggleDay = function(open) {
        if (open) {
            if(!confirm('האם לפתוח יום חדש? (זה יאפס את ההזמנות הקודמות במסך הפעיל)')) return;
            set(ref(db, 'status/isDayOpen'), true);
            set(ref(db, 'orders'), null);
        } else {
            if(!confirm('האם לסגור את היום?')) return;
            set(ref(db, 'status/isDayOpen'), false);
        }
    }

    // תפריט
    onValue(ref(db, 'drinks'), (snapshot) => {
        const data = snapshot.val();
        const list = document.getElementById('drinksList');
        list.innerHTML = '';
        if (data) {
            Object.keys(data).forEach(key => {
                let drink = data[key];
                let li = document.createElement('li');
                li.style.display = 'flex';
                li.style.justifyContent = 'space-between';
                li.style.alignItems = 'center';
                li.style.margin = '5px 0';
                li.style.background = '#333';
                li.style.padding = '5px 10px';
                li.style.borderRadius = '4px';
                li.innerHTML = `<span>${drink.name} - <strong>${drink.price} ₪</strong></span> <button onclick="removeDrink('${key}')" style="width: auto; background: #f44336; padding: 2px 8px; margin:0;">מחק</button>`;
                list.appendChild(li);
            });
        }
    });

    window.addDrink = function() {
        const name = document.getElementById('newDrinkName').value.trim();
        const price = parseFloat(document.getElementById('newDrinkPrice').value);
        if(name && !isNaN(price)) {
            push(ref(db, 'drinks'), { name, price });
            document.getElementById('newDrinkName').value = '';
            document.getElementById('newDrinkPrice').value = '';
        } else {
            alert('נא להזין שם ומחיר תקינים');
        }
    }

    window.removeDrink = function(key) {
        remove(ref(db, 'drinks/' + key));
    }

    // הזמנות פעילות
    onValue(ref(db, 'orders'), (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('activeOrdersTable');
        tbody.innerHTML = '';
        
        if (!data) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">אין הזמנות פעילות כרגע</td></tr>`;
            return;
        }

        Object.keys(data).forEach(key => {
            let order = data[key];
            let total = order.price * order.qty;
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${order.clientName}</td>
                <td>${order.memberId}</td>
                <td>${order.drink}</td>
                <td>${order.qty}</td>
                <td>${total} ₪</td>
                <td><button onclick="completeOrder('${key}')" style="background:#4caf50; padding:5px; margin:0; width:auto;">בוצע / נמסר</button></td>
            `;
            tbody.appendChild(tr);
        });
    });

    window.completeOrder = function(key) {
        remove(ref(db, 'orders/' + key));
    }
</script>

</body>
</html>
