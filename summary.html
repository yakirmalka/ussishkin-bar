<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סיכום ופילוח הזמנות - בר</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">📊 סיכום ופילוח הזמנות</h1>
            <a href="index.html" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">חזרה לניהול</a>
        </div>

        <!-- בחירת תאריך -->
        <div class="mb-6 flex flex-wrap items-center gap-4 bg-gray-50 p-4 rounded-lg">
            <label for="dateFilter" class="font-bold text-gray-700">בחר תאריך לסיכום:</label>
            <input type="date" id="dateFilter" class="border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="filterBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">סינון לפי תאריך</button>
            <button id="allTimeBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">הצג הכל (היסטוריה מלאה)</button>
        </div>

        <!-- כרטיסי סיכום ראשיים -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg text-center">
                <h3 class="text-gray-600 font-semibold">סה"כ הכנסות לתקופה הנבחרת</h3>
                <p id="totalRevenue" class="text-3xl font-bold text-blue-600 mt-2">₪0</p>
            </div>
            <div class="bg-purple-50 border border-purple-200 p-4 rounded-lg text-center">
                <h3 class="text-gray-600 font-semibold">סה"כ הזמנות</h3>
                <p id="totalOrdersCount" class="text-3xl font-bold text-purple-600 mt-2">0</p>
            </div>
        </div>

        <!-- פילוח מוצרים נמכרים -->
        <div class="mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-3">🍺 פילוח מוצרים שנמכרו</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700">
                            <th class="p-3 border">שם המוצר</th>
                            <th class="p-3 border">כמות שנמכרה</th>
                            <th class="p-3 border">סה"כ הכנסה מהמוצר</th>
                        </tr>
                    </thead>
                    <tbody id="productsSummaryTable">
                        <tr><td colspan="3" class="text-center p-4 text-gray-500">טוען נתונים...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- פירוט כל ההזמנות -->
        <div>
            <h2 class="text-xl font-bold text-gray-800 mb-3">📝 פירוט הזמנות</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700">
                            <th class="p-3 border">תאריך ושעה</th>
                            <th class="p-3 border">שם הלקוח</th>
                            <th class="p-3 border">מס' חבר</th>
                            <th class="p-3 border">משקה</th>
                            <th class="p-3 border">כמות</th>
                            <th class="p-3 border">סה"כ</th>
                        </tr>
                    </thead>
                    <tbody id="ordersListTable">
                        <tr><td colspan="6" class="text-center p-4 text-gray-500">טוען נתונים...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const appConfig = {
            databaseURL: "https://ussishkinpub-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(appConfig);
        const database = firebase.database();

        loadAllOrders(null);

        document.getElementById('filterBtn').addEventListener('click', function() {
            var selectedDate = document.getElementById('dateFilter').value;
            loadAllOrders(selectedDate);
        });

        document.getElementById('allTimeBtn').addEventListener('click', function() {
            document.getElementById('dateFilter').value = '';
            loadAllOrders(null);
        });

        function loadAllOrders(filterDate) {
            console.log("מושך נתונים מ-Firebase... תאריך סינון:", filterDate);
            
            database.ref('orders').once('value').then(function(snapshot) {
                var data = snapshot.val();
                console.log("תוצאה גולמית מ-Firebase:", data);

                var ordersTable = document.getElementById('ordersListTable');
                var productsTable = document.getElementById('productsSummaryTable');
                
                ordersTable.innerHTML = '';
                productsTable.innerHTML = '';

                if (!data) {
                    ordersTable.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-gray-500">אין נתונים בענף orders במסד הנתונים</td></tr>';
                    productsTable.innerHTML = '<tr><td colspan="3" class="text-center p-4 text-gray-500">אין נתונים</td></tr>';
                    document.getElementById('totalRevenue').innerText = '₪0';
                    document.getElementById('totalOrdersCount').innerText = '0';
                    return;
                }

                var totalRevenue = 0;
                var totalCount = 0;
                var productStats = {};
                var listToDisplay = [];

                Object.keys(data).forEach(function(key) {
                    var order = data[key];
                    if (!order) return;

                    var orderDateOnly = '';
                    var readableTime = 'לא ידוע';

                    if (order.timestamp) {
                        try {
                            var ts = typeof order.timestamp === 'number' ? order.timestamp : Number(order.timestamp);
                            var d = new Date(ts);
                            if (!isNaN(d.getTime())) {
                                orderDateOnly = d.toISOString().split('T')[0];
                                readableTime = d.toLocaleString('he-IL');
                            } else {
                                orderDateOnly = String(order.timestamp).split('T')[0];
                                readableTime = String(order.timestamp);
                            }
                        } catch (err) {
                            console.error('שגיאה בחישוב תאריך:', err);
                        }
                    }

                    if (!filterDate || orderDateOnly === filterDate) {
                        listToDisplay.push({
                            clientName: order.clientName || 'אורח',
                            memberId: order.memberId || '-',
                            drink: order.drink || 'לא ידוע',
                            qty: Number(order.qty) || 1,
                            price: Number(order.price) || 0,
                            timeFormatted: readableTime
                        });

                        var lineTotal = (Number(order.price) || 0) * (Number(order.qty) || 1);
                        totalRevenue += lineTotal;
                        totalCount++;

                        var drinkName = order.drink || 'לא ידוע';
                        if (!productStats[drinkName]) {
                            productStats[drinkName] = { count: 0, revenue: 0 };
                        }
                        productStats[drinkName].count += (Number(order.qty) || 1);
                        productStats[dev => {} ? drinkName : drinkName].revenue += lineTotal; // Fixed simple accumulation
                    }
                });

                // תיקון הצבירה למוצרים בצורה נקייה
                productStats = {};
                listToDisplay.forEach(function(item) {
                    if (!productStats[item.drink]) {
                        productStats[item.drink] = { count: 0, revenue: 0 };
                    }
                    productStats[item.drink].count += item.qty;
                    productStats[item.drink].revenue += (item.price * item.qty);
                });

                document.getElementById('totalRevenue').innerText = '₪' + totalRevenue;
                document.getElementById('totalOrdersCount').innerText = totalCount;

                // הצגת פילוח מוצרים
                var productKeys = Object.keys(productStats);
                if (productKeys.length === 0) {
                    productsTable.innerHTML = '<tr><td colspan="3" class="text-center p-4 text-gray-500">אין נתונים לתקופה זו</td></tr>';
                } else {
                    productKeys.forEach(function(pName) {
                        var pData = productStats[pName];
                        productsTable.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 border">${pName}</td>
                                <td class="p-3 border font-bold">${pData.count}</td>
                                <td class="p-3 border text-green-600 font-bold">₪${pData.revenue}</td>
                            </tr>
                        `;
                    });
                }

                // הצגת רשימת ההזמנות
                if (listToDisplay.length === 0) {
                    ordersTable.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-gray-500">אין הזמנות לתקופה זו</td></tr>';
                } else {
                    listToDisplay.reverse().forEach(function(item) {
                        var rowTotal = item.price * item.qty;
                        ordersTable.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 border text-sm text-gray-600">${item.timeFormatted}</td>
                                <td class="p-3 border font-semibold">${item.clientName}</td>
                                <td class="p-3 border">${item.memberId}</td>
                                <td class="p-3 border">${item.drink}</td>
                                <td class="p-3 border">${item.qty}</td>
                                <td class="p-3 border text-blue-600 font-bold">₪${rowTotal}</td>
                            </tr>
                        `;
                    });
                }
            }).catch(function(error) {
                console.error("שגיאה בחיבור ל-Firebase:", error);
                document.getElementById('ordersListTable').innerHTML = `<tr><td colspan="6" class="text-center p-4 text-red-500">שגיאה: ${error.message}</td></tr>`;
            });
        }
    </script>
</body>
</html>
