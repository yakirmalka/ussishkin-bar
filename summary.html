<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סיכום יומי ופילוח הזמנות - בר</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">📊 סיכום ופילוח הזמנות</h1>
            <a href="index.html" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">חזרה לניהול</a>
        </div>

        <!-- בחירת תאריך -->
        <div class="mb-6 flex flex-wrap items-center gap-4 bg-gray-50 p-4 rounded-lg">
            <label for="dateFilter" class="font-bold text-gray-700">בחר תאריך לסיכום:</label>
            <input type="date" id="dateFilter" class="border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="filterBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">סין לפי תאריך</button>
            <button id="allTimeBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">הצג הכל (היסטוריה מלאה)</button>
        </div>

        <!-- כרטיסי סיכום ראשיים -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg text-center">
                <h3 class="text-gray-600 font-semibold">סה"כ הכנסות לתקופה הנבחרת</h3>
                <p id="totalRevenue" class="text-3xl font-bold text-blue-600 mt-2">₪0</p>
            </div>
            <div class="bg-purple-50 border border-purple-200 p-4 rounded-lg text-center">
                <h3 class="text-gray-600 font-semibold">סה"כ הזמנות</h3>
                <p id="totalOrdersCount" class="text-3xl font-bold text-purple-600 mt-2">0</p>
            </div>
        </div>

        <!-- פילוח מוצרים נמכרים -->
        <div class="mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-3">🍺 פילוח מוצרים שנמכרו</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700">
                            <th class="p-3 border">שם המוצר</th>
                            <th class="p-3 border">כמות שנמכרה</th>
                            <th class="p-3 border">סה"כ הכנסה מהמוצר</th>
                        </tr>
                    </thead>
                    <tbody id="productsSummaryTable">
                        <tr><td colspan="3" class="text-center p-4 text-gray-500">טוען נתונים...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- פירוט כל ההזמנות -->
        <div>
            <h2 class="text-xl font-bold text-gray-800 mb-3">📝 פירוט הזמנות</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700">
                            <th class="p-3 border">תאריך ושעה</th>
                            <th class="p-3 border">שם הלקוח</th>
                            <th class="p-3 border">מס' חבר</th>
                            <th class="p-3 border">משקה</th>
                            <th class="p-3 border">כמות</th>
                            <th class="p-3 border">סה"כ</th>
                        </tr>
                    </thead>
                    <tbody id="ordersListTable">
                        <tr><td colspan="6" class="text-center p-4 text-gray-500">טוען נתונים...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfigSummary = {
            databaseURL: "https://ussishkinpub-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfigSummary);
        const db = firebase.database();

        // כברירת מחדל נטען את כל הנתונים (היסטוריה מלאה) כדי שום דבר לא יתפספס
        loadOrders(null);

        document.getElementById('filterBtn').addEventListener('click', () => {
            const selectedDate = document.getElementById('dateFilter').value;
            loadOrders(selectedDate);
        });

        document.getElementById('allTimeBtn').addEventListener('click', () => {
            document.getElementById('dateFilter').value = '';
            loadOrders(null);
        });

        function loadOrders(filterDate) {
            const ordersRef = db.ref('orders');
            ordersRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                const ordersListTable = document.getElementById('ordersListTable');
                const productsSummaryTable = document.getElementById('productsSummaryTable');
                
                ordersListTable.innerHTML = '';
                productsSummaryTable.innerHTML = '';

                if (!data) {
                    ordersListTable.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-gray-500">אין הזמנות במסד הנתונים בכלל</td></tr>';
                    document.getElementById('totalRevenue').innerText = '₪0';
                    document.getElementById('totalOrdersCount').innerText = '0';
                    productsSummaryTable.innerHTML = '<tr><td colspan="3" class="text-center p-4 text-gray-500">אין נתונים</td></tr>';
                    return;
                }

                let totalRev = 0;
                let orderCount = 0;
                let productStats = {}; 
                let filteredOrders = [];

                Object.keys(data).forEach(key => {
                    const order = data[key];
                    
                    let orderDate = '';
                    let dateTimeFormatted = 'לא ידוע';

                    if (order.timestamp) {
                        try {
                            const dateObj = new Date(typeof order.timestamp === 'number' ? order.timestamp : Number(order.timestamp) || order.timestamp);
                            if (!isNaN(dateObj.getTime())) {
                                orderDate = dateObj.toISOString().split('T')[0];
                                dateTimeFormatted = dateObj.toLocaleString('he-IL');
                            } else if (typeof order.timestamp === 'string') {
                                orderDate = order.timestamp.split('T')[0];
                                dateTimeFormatted = order.timestamp;
                            }
                        } catch (e) {
                            console.error('Error parsing date:', e);
                        }
                    }

                    // סינון לפי תאריך רק אם המשתמש בחר תאריך ספציפי
                    if (!filterDate || orderDate === filterDate) {
                        filteredOrders.push({ ...order, dateTimeFormatted });
                        
                        let orderTotal = (Number(order.price) || 0) * (Number(order.qty) || 1);
                        totalRev += orderTotal;
                        orderCount++;

                        let pName = order.drink || 'מוצר לא ידוע';
                        let pQty = Number(order.qty || 1);
                        let pPrice = orderTotal;

                        if (!productStats[pName]) {
                            productStats[pName] = { count: 0, revenue: 0 };
                        }
                        productStats[pName].count += pQty;
                        productStats[pName].revenue += pPrice;
                    }
                });

                document.getElementById('totalRevenue').innerText = '₪' + totalRev;
                document.getElementById('totalOrdersCount').innerText = orderCount;

                if (Object.keys(productStats).length === 0) {
                    productsSummaryTable.innerHTML = '<tr><td colspan="3" class="text-center p-4 text-gray-500">אין נתונים לתקופה זו</td></tr>';
                } else {
                    Object.keys(productStats).forEach(pName => {
                        let stat = productStats[pName];
                        productsSummaryTable.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 border">${pName}</td>
                                <td class="p-3 border font-bold">${stat.count}</td>
                                <td class="p-3 border text-green-600 font-bold">₪${stat.revenue}</td>
                            </tr>
                        `;
                    });
                }

                if (filteredOrders.length === 0) {
                    ordersListTable.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-gray-500">אין הזמנות לתקופה זו</td></tr>';
                } else {
                    filteredOrders.reverse().forEach(order => {
                        let orderTotal = (Number(order.price) || 0) * (Number(order.qty) || 1);
                        ordersListTable.innerHTML => { // Note: innerHTML assignment fixed below in mind
                        }
                        ordersListTable.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 border text-sm text-gray-600">${order.dateTimeFormatted}</td>
                                <td class="p-3 border font-semibold">${order.clientName || 'אורח'}</td>
                                <td class="p-3 border">${order.memberId || '-'}</td>
                                <td class="p-3 border">${order.drink || ''}</td>
                                <td class="p-3 border">${order.qty || 1}</td>
                                <td class="p-3 border text-blue-600 font-bold">₪${orderTotal}</td>
                            </tr>
                        `;
                    });
                }
            });
        }
    </script>
</body>
</html>
